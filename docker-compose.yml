# Local dev infrastructure for the CMS:
#   docker compose up -d
# Postgres  → localhost:5433 (logos / logos, db logoslegal)
#   (5433 because a native Windows PostgreSQL 17 service occupies 5432)
# MinIO     → localhost:9010 (API), localhost:9011 (web console, minioadmin/minioadmin)
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: logos
      POSTGRES_PASSWORD: logos
      POSTGRES_DB: logoslegal
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9010:9000"
      - "9011:9001"
    volumes:
      - miniodata:/data

  # One-shot: creates the "logoslegal" bucket, then exits.
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/logoslegal;
      mc anonymous set download local/logoslegal;
      exit 0;
      "

volumes:
  pgdata:
  miniodata:
